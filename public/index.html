<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterviewLens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 600px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }

    .input-row {
      display: flex;
      gap: 0.75rem;
    }

    input[type="text"] {
      flex: 1;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #4f46e5;
    }

    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) { background: #4338ca; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Loading */
    .loading {
      display: none;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1.75rem;
      color: #6b7280;
      font-size: 0.95rem;
    }

    .loading.visible { display: flex; }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid #d1d5db;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Questions */
    .questions {
      display: none;
      margin-top: 1.75rem;
    }

    .questions.visible { display: block; }

    .questions h2 {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1.5px solid #e5e7eb;
    }

    ol {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    li {
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
    }

    .num {
      background: #eef2ff;
      color: #4f46e5;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .question-text {
      font-size: 0.97rem;
      line-height: 1.55;
      color: #1f2937;
    }

    /* Error */
    .error {
      display: none;
      margin-top: 1.25rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: #b91c1c;
      font-size: 0.9rem;
    }

    .error.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>InterviewLens</h1>
    <p class="subtitle">Enter a job title to generate 3 tailored interview questions.</p>

    <label for="jobTitle">Job Title</label>
    <div class="input-row">
      <input
        type="text"
        id="jobTitle"
        value="Customer Success Manager"
        placeholder="e.g. Customer Success Manager"
        autocomplete="off"
      />
      <button id="submitBtn" type="button">Generate</button>
    </div>

    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>Generating questions…</span>
    </div>

    <div class="error" id="error"></div>

    <div class="questions" id="questions">
      <h2 id="questionsHeading"></h2>
      <ol id="questionsList"></ol>
    </div>
  </div>

  <script>
    const input = document.getElementById("jobTitle");
    const btn = document.getElementById("submitBtn");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const questionsSection = document.getElementById("questions");
    const questionsHeading = document.getElementById("questionsHeading");
    const questionsList = document.getElementById("questionsList");

    function setLoading(isLoading) {
      btn.disabled = isLoading;
      loading.classList.toggle("visible", isLoading);
    }

    function showError(msg) {
      error.textContent = msg;
      error.classList.add("visible");
    }

    function clearResults() {
      error.classList.remove("visible");
      questionsSection.classList.remove("visible");
      questionsList.innerHTML = "";
    }

    async function generate() {
      const jobTitle = input.value.trim();
      if (!jobTitle) {
        showError("Please enter a job title.");
        return;
      }

      clearResults();
      setLoading(true);

      try {
        const res = await fetch("/api/questions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ jobTitle }),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || "An unexpected error occurred.");
        }

        questionsHeading.textContent = `Interview questions for: ${jobTitle}`;
        questionsList.innerHTML = "";
        data.questions.forEach((q, i) => {
          const li = document.createElement("li");
          const num = document.createElement("span");
          num.className = "num";
          num.textContent = i + 1;
          const text = document.createElement("span");
          text.className = "question-text";
          text.textContent = q;
          li.appendChild(num);
          li.appendChild(text);
          questionsList.appendChild(li);
        });
        questionsSection.classList.add("visible");
      } catch (err) {
        showError(err.message || "Something went wrong. Please try again.");
      } finally {
        setLoading(false);
      }
    }

    btn.addEventListener("click", generate);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") generate();
    });
  </script>
</body>
</html>
